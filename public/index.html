<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ごきぶりポーカー</title>
<style>
:root{--teal:#2EA89E;--teal-d:#1f7f77;--amber:#E0A45C;--bg:#f4faf9;--ink:#1d2b2a;--card:#fff;--line:#d6e6e4;--red:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0;color:var(--teal-d)}
h2{font-size:16px;margin:16px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
input{width:100%;padding:12px;font-size:18px;border:2px solid var(--line);border-radius:10px;margin:4px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
button.sub{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}
button.amber{background:var(--amber);color:#3a2a10}
button.wide{width:100%;margin:5px 0}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.code{font-size:44px;letter-spacing:8px;font-weight:800;color:var(--teal-d);text-align:center}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;border:2px solid var(--line);margin:6px 0;background:#fff}
.pl.turn{border-color:var(--amber);background:#fff8ec}
.pl.me{border-left:6px solid var(--teal)}
.pl.off{opacity:.5}
.pile{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{background:#eef6f5;border-radius:8px;padding:1px 7px;font-size:15px}
.chip.warn{background:#ffe3a8;font-weight:700}
.chip.danger{background:#f8c9c7;font-weight:700}
.hand{display:flex;flex-wrap:wrap;gap:6px}
.c{width:62px;position:relative;transition:transform .12s}
.c .card-svg{display:block;width:100%;filter:drop-shadow(0 2px 2px #0003)}
.c.sel{transform:translateY(-8px) scale(1.06);filter:drop-shadow(0 0 5px var(--amber))}
.card-svg{display:block;width:100%;height:auto}
.bigcard{width:150px;margin:6px auto}
.bigcard.sm{width:96px}
.mini{display:inline-flex;align-items:flex-end;gap:2px;margin-right:6px}
.mini .card-svg{width:24px}
.mini b{font-size:13px}
.mini.warn .card-svg{filter:drop-shadow(0 0 3px #e0a45c)}
.mini.danger .card-svg{filter:drop-shadow(0 0 4px #d9534f)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:8px 2px;font-size:24px;line-height:1.2}
.types button small{display:block;font-size:11px;font-weight:400}
.types button.on{border-color:var(--amber);background:#fff8ec}
.big{font-size:60px;text-align:center}
.msg{background:var(--teal);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700}
.msg.amber{background:var(--amber);color:#3a2a10}
.log{font-size:13px;color:#566;margin:0;padding-left:18px}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.flip{animation:flip .9s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6);opacity:0}60%{transform:rotateY(-12deg) scale(1.15)}100%{transform:none;opacity:1}}
.tg button{margin:3px 4px 3px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="cards.js"></script>
<script>
const TYPES = {cockroach:['🪳','ゴキブリ'],rat:['🐀','ネズミ'],bat:['🦇','コウモリ'],fly:['🪰','ハエ'],toad:['🐸','カエル'],spider:['🕷️','クモ'],scorpion:['🦂','サソリ'],stinkbug:['🪲','カメムシ']};
const KEYS = Object.keys(TYPES);
const $app = document.getElementById('app');
let ws, S = null, err = '';
let lastKey = '', sel = null, target = null; // 操作中の選択
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

function connect(first){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen = first;
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.t==='joined'){ store.set('token',m.token); }
    else if(m.t==='error'){ err = m.text; render(); }
    else if(m.t==='state'){
      if(S && (S.phase!==m.phase || S.turn!==m.turn || (S.offer&&S.offer.to)!==(m.offer&&m.offer.to) || (S.offer&&S.offer.peeked)!==(m.offer&&m.offer.peeked))){ sel=target=null; }
      S = m; err=''; store.set('room',m.room); render();
    }
  };
  ws.onclose = () => { setTimeout(()=>{ if(S){ connect(()=>send({t:'join',room:S.room,name:store.get('name')||'',token:store.get('token')})); } },1500); };
}
const send = o => ws && ws.readyState===1 && ws.send(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tn = k => TYPES[k][0]+TYPES[k][1];

function home(){
  $app.innerHTML = `<h1>🪳 ごきぶりポーカー</h1>
  <div class="box"><b>なまえ</b><input id="nm" maxlength="8" placeholder="8文字まで" value="${esc(store.get('name')||'')}">
  <button class="wide" id="mk">部屋をつくる</button></div>
  <div class="box"><b>部屋コードで入る</b><input id="rc" inputmode="numeric" maxlength="4" placeholder="4けたの数字">
  <button class="wide sub" id="jn">入る</button></div>
  <div class="err">${esc(err)}</div>
  <p style="font-size:13px;color:#566">2〜6人。それぞれのスマホで自分の手札だけが見えます。</p>`;
  const name = () => { const v=document.getElementById('nm').value.trim(); store.set('name',v); return v; };
  document.getElementById('mk').onclick = () => { const n=name(); connect(()=>send({t:'create',name:n})); };
  document.getElementById('jn').onclick = () => { const n=name(), r=document.getElementById('rc').value.trim(); connect(()=>send({t:'join',room:r,name:n})); };
}

function playerCard(p,i){
  const counts = {}; p.pile.forEach(t=>counts[t]=(counts[t]||0)+1);
  const chips = Object.keys(counts).map(t=>`<span class="mini ${counts[t]>=4?'danger':counts[t]>=3?'warn':''}">${CARDS.cardSVG(t)}<b>×${counts[t]}</b></span>`).join('');
  const kinds = Object.keys(counts).length;
  return `<div class="pl ${S.turn===i&&S.phase!=='lobby'?'turn':''} ${i===S.me?'me':''} ${p.online?'':'off'}">
    <div><b>${esc(p.name)}</b>${i===S.me?'（あなた）':''}${p.seen?' 👀':''}
    <div class="pile">${chips||'<span style="color:#9aa">前のカード なし</span>'}${kinds>=6?`<span class="chip warn">${kinds}/8種類</span>`:''}</div></div>
    ${S.phase==='lobby'?'':`<div class="mini">${CARDS.cardBack()}<b>×${p.handCount}</b></div>`}</div>`;
}

function targetPicker(exclude){
  return `<div class="tg">${S.players.map((p,i)=>exclude.includes(i)?'':`<button class="${target===i?'amber':'sub'}" data-target="${i}">${esc(p.name)}</button>`).join('')}</div>`;
}

function render(){
  if(!S) return home();
  const me = S.me, mine = S.players[me], o = S.offer;
  let h = `<h1>🪳 ごきぶりポーカー <span style="font-size:13px;color:#566">部屋 ${S.room}</span></h1>`;

  if(S.phase==='lobby'){
    h += `<div class="box"><div style="text-align:center">部屋コード</div><div class="code">${S.room}</div>
    <div style="text-align:center;font-size:13px;color:#566">みんなに伝えて、このコードで入ってもらいます</div></div>
    <h2>参加者（${S.players.length}人）</h2>${S.players.map(playerCard).join('')}`;
    h += S.host ? `<button class="wide" id="start" ${S.players.length<2?'disabled':''}>ゲーム開始</button>${S.players.length<2?'<div style="font-size:13px">あと1人以上でスタートできます</div>':''}`
                : `<div class="msg amber">ホストが始めるのを待っています…</div>`;
    $app.innerHTML = h; bind(); return;
  }

  // 直前の結果
  if(S.last && S.phase!=='over' && S.phase!=='reveal'){
    const L=S.last, gv=S.players[L.giver].name, rc=S.players[L.receiver].name, tk=S.players[L.taker].name;
    const key = JSON.stringify(L), fresh = key!==lastKey; lastKey = key;
    h += `<div class="box" style="text-align:center"><div class="bigcard ${fresh?'flip':''}">${CARDS.cardSVG(L.card)}</div>
    ${esc(gv)} → ${esc(rc)}　正体は <b>${TYPES[L.card][1]}</b><br><b>${esc(tk)}さんが引き取り</b></div>`;
  }

  if(S.phase==='over'){
    const L=S.players[S.loser];
    h += `<div class="msg" style="text-align:center;font-size:20px;background:var(--red)">🏁 ${esc(L.name)}さんの負け！<br><small>${esc(S.reason)}</small></div>
    <p>ほかのみんなの勝ちです 🎉</p>`;
    h += S.host ? `<button class="wide" id="again">もう一度あそぶ</button>` : `<div class="msg amber">ホストが次を始めるのを待っています</div>`;
  } else if(S.phase==='turn'){
    if(S.turn===me){
      h += `<div class="msg amber">あなたの番です。渡すカードと相手を選んで「渡す」。<br>相手には声で「これは○○」と言いましょう</div>`;
    } else h += `<div class="msg">${esc(S.players[S.turn].name)}さんの番です</div>`;
  } else if(S.phase==='reveal'){
    const from=S.players[o.from].name, to=S.players[o.to].name;
    const fresh = lastKey!=='r'+o.card+o.from+o.to; lastKey='r'+o.card+o.from+o.to;
    h += `<div class="box" style="text-align:center"><div class="bigcard ${fresh?'flip':''}">${CARDS.cardSVG(o.card)}</div><div style="font-size:13px;color:#566">${esc(from)} → ${esc(to)}</div></div>`;
    if(o.to===me){
      h += `<div class="msg amber" style="text-align:center">言った通りでしたか？<br>当たった・外れたを選んでください</div>
      <button class="wide" data-resolve="false" style="padding:16px">当たった！<br><small>${esc(from)}さんが引き取る</small></button>
      <button class="wide amber" data-resolve="true" style="padding:16px">外れた…<br><small>自分が引き取る</small></button>`;
    } else h += `<div class="msg">${esc(to)}さんが決めています…</div>`;
  } else if(S.phase==='offered'){
    const from=S.players[o.from].name, to=S.players[o.to].name;
    if(o.to===me){
      if(!o.peeked){
        const rest = S.players.map((_,i)=>i).filter(i=>i!==me && !S.players[i].seen);
        h += `<div class="msg amber" style="text-align:center">${esc(from)}さんから届きました<div class="bigcard sm">${CARDS.cardBack()}</div>声で「ホント」か「ウソ」と答えて、めくりましょう</div>
        <button class="wide" id="open" style="font-size:22px;padding:18px">めくる！</button>
        ${rest.length?`<button class="wide sub" id="peek">こっそり見て、別の人に回す</button>`:`<div style="font-size:13px;color:#566">全員が見たので、めくるしかありません</div>`}`;
      } else {
        const seenIdx = S.players.map((p,i)=>p.seen||i===me?i:-1).filter(i=>i>=0);
        h += `<div class="box" style="text-align:center"><div>あなただけに見えます</div><div class="bigcard sm">${CARDS.cardSVG(o.card)}</div></div>
        <b>だれに回す？</b>（声で「これは○○」と言ってください）${targetPicker(seenIdx)}
        <button class="wide" id="pass" ${target!==null?'':'disabled'}>回す</button>`;
      }
    } else if(o.from===me){
      h += `<div class="msg" style="text-align:center">あなた → ${esc(to)}さん<div class="bigcard sm">${CARDS.cardBack()}</div>相手の顔を見て待ちましょう</div>`;
    } else {
      h += `<div class="msg" style="text-align:center">${esc(from)} → ${esc(to)}さん${o.peeked?'（こっそり見ています）':''}<div class="bigcard sm">${CARDS.cardBack()}</div></div>`;
    }
  }

  // 自分の手札
  if(S.phase!=='over'){
    const myTurn = S.phase==='turn' && S.turn===me;
    const idxs = S.hand.map((t,i)=>i).sort((a,b)=>KEYS.indexOf(S.hand[a])-KEYS.indexOf(S.hand[b]));
    h += `<h2>あなたの手札（${S.hand.length}枚）<small style="font-weight:400;color:#889"> 他の人に見せないで</small></h2><div class="hand">${idxs.map(i=>`<div class="c ${sel===i?'sel':''}" ${myTurn?`data-card="${i}"`:''}>${CARDS.cardSVG(S.hand[i])}</div>`).join('')||'<span>なし</span>'}</div>`;
    if(myTurn){
      h += `<h2>渡す相手</h2>${targetPicker([me])}
      <button class="wide" id="offer" ${sel!==null&&target!==null?'':'disabled'}>渡す</button>`;
    }
  }

  h += `<h2>みんなの前のカード</h2>${S.players.map(playerCard).join('')}`;
  if(S.removed) h += `<div style="font-size:12px;color:#889">※割り切れない${S.removed}枚は使っていません</div>`;
  h += `<h2>これまで</h2><ul class="log">${S.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
  $app.innerHTML = h; bind();
}

function bind(){
  const q = (s,f)=>document.querySelectorAll(s).forEach(f);
  const $ = id => document.getElementById(id);
  if($('start')) $('start').onclick = ()=>send({t:'start'});
  if($('again')) $('again').onclick = ()=>send({t:'rematch'});
  q('[data-card]',el=>el.onclick=()=>{sel=+el.dataset.card;render()});
  q('[data-target]',el=>el.onclick=()=>{target=+el.dataset.target;render()});
  q('[data-resolve]',el=>el.onclick=()=>send({t:'resolve',take:el.dataset.resolve==='true'}));
  if($('open')) $('open').onclick = ()=>send({t:'open'});
  if($('peek')) $('peek').onclick = ()=>send({t:'peek'});
  if($('offer')) $('offer').onclick = ()=>send({t:'offer',card:sel,to:target});
  if($('pass')) $('pass').onclick = ()=>send({t:'pass',to:target});
}

// 再接続（画面を閉じても戻れる）
(function(){
  const r=store.get('room'), t=store.get('token');
  if(r&&t){ connect(()=>send({t:'join',room:r,name:store.get('name')||'',token:t})); setTimeout(()=>{ if(!S) home(); },1200); }
  else home();
})();
</script>
</body>
</html>
